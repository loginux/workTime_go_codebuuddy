{{define "title"}}{{.Title}}{{end}}

{{define "content"}}
<div class="page-header">
    <h2>{{.Title}}</h2>
</div>

<form method="POST" class="form" action="{{.Action}}">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">

    <div class="form-group">
        <label>项目名称</label>
        <input type="text" name="name" class="input" placeholder="项目名称" value="{{.Name}}">
    </div>

    <div class="form-group">
        <label>描述</label>
        <textarea name="description" class="textarea" placeholder="选填" rows="3">{{.Desc}}</textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="/projects" class="btn">取消</a>
    </div>
</form>
{{end}}
