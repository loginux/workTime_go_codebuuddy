name: Build workTime

on:
  workflow_dispatch:        # 手动触发
  push:
    branches:
      - main                # 每次推送自动构建

permissions:
  contents: write

jobs:
  # 计算下一个版本号：取最新 v* tag，minor +1（v0.1 -> v0.2 -> ...）
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
    steps:
      - name: 检出代码（含全部 tag）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 计算版本号
        id: calc
        run: |
          LAST=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$LAST" ]; then
            NEXT="v1.0"
          else
            VER="${LAST#v}"
            MAJOR="${VER%%.*}"
            MINOR="${VER#*.}"
            if [ "$MAJOR" = "0" ]; then
              NEXT="v1.0"
            else
              NEXT="v${MAJOR}.$((MINOR + 1))"
            fi
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "上一个版本: ${LAST:-无}，本次版本: $NEXT"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: windows-amd64
            goos: windows
            goarch: amd64
            ext: .exe
          - platform: linux-amd64
            goos: linux
            goarch: amd64
          - platform: linux-arm64
            goos: linux
            goarch: arm64
          - platform: linux-armv7
            goos: linux
            goarch: arm
            goarm: "7"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 下载 Chart.js 打入包内（不依赖 CDN）
        run: |
          curl -fsSL --retry 3 -o web/static/js/chart.umd.min.js \
            https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js \
          || curl -fsSL --retry 3 -o web/static/js/chart.umd.min.js \
            https://unpkg.com/chart.js@4/dist/chart.umd.min.js
          ls -lh web/static/js/chart.umd.min.js

      - name: 构建
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          go mod tidy
          OUTPUT="workTime-${{ needs.version.outputs.version }}-${{ matrix.platform }}${{ matrix.ext }}"
          go build -trimpath -ldflags "-s -w" -o "dist/${OUTPUT}" .
          echo "--- 构建完成 ---"
          ls -lh dist/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: workTime-${{ needs.version.outputs.version }}-${{ matrix.platform }}
          path: dist/workTime*

  # 汇总所有平台产物，创建 Release（自动打 tag）
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: 汇总下载产物
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: 发布 Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.version.outputs.version }}
          name: workTime ${{ needs.version.outputs.version }}
          artifacts: dist/*
          generateReleaseNotes: true
          makeLatest: true
          allowUpdates: true
